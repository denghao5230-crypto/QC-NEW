<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>森雅验货系统</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<!-- LOGIN PAGE -->
<div class="page login-page active" id="loginPage">
  <div class="login-logo">
    <img src="logo-white.png" alt="SENIA 森雅國際">
  </div>
  <div class="login-subtitle">Quality Inspection System 验货系统</div>
  <div class="login-card">
    <h2>登录 Sign in</h2>
    <div class="form-group">
      <label>用户名 Username</label>
      <input type="text" id="loginUser" placeholder="输入用户名">
    </div>
    <div class="form-group">
      <label>密码 Password</label>
      <input type="password" id="loginPass" placeholder="输入密码">
    </div>
    <div class="form-group">
      <label>角色 Role</label>
      <select id="loginRole">
        <option value="inspector">质检员 Inspector</option>
        <option value="supervisor">主管 Supervisor</option>
      </select>
    </div>
    <div id="serverStatus" style="font-size:.78rem;margin-bottom:12px;padding:8px;background:#f0f0f0;border-radius:6px;text-align:center"></div>
    <button class="btn btn-primary" onclick="doLogin()">登录 Login</button>
  </div>
</div>

<!-- MAIN APP -->
<div class="page" id="mainApp">
  <div class="header">
    <h1 id="headerTitle">我的报告</h1>
    <div style="display:flex;gap:8px;align-items:center">
      <span id="syncStatus" style="font-size:.75rem;color:rgba(255,255,255,.8)"></span>
      <button class="header-btn" id="userBadge" onclick="logout()">用户</button>
    </div>
  </div>

  <div class="content" id="mainContent"></div>

  <div class="bottom-nav" id="bottomNav">
    <button id="tabList" class="active" onclick="switchTab('list')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      报告
    </button>
    <button id="tabNew" onclick="switchTab('new')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      新建
    </button>
    <button id="tabMe" onclick="switchTab('me')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      我的
    </button>
    <button id="tabTrash" onclick="switchTab('trash')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      回收
    </button>
  </div>

  <!-- Report Form Modal -->
  <div class="page" id="reportForm" style="display:none;min-height:auto;position:fixed;top:60px;left:0;right:0;bottom:60px;z-index:50;overflow-y:auto;background:#f0f2f5;padding:12px">
    <div style="position:absolute;top:12px;right:12px;z-index:100">
      <button class="btn btn-sm btn-outline" onclick="document.getElementById('reportForm').style.display='none'">关闭</button>
    </div>
    <div id="formContent"></div>
  </div>
</div>

<!-- Photo action sheet -->
<div class="action-sheet-overlay" id="photoOverlay" onclick="closePhotoSheet()"></div>
<div class="action-sheet" id="photoSheet">
  <button onclick="chooseCamera()">📷 拍照 Take Photo</button>
  <button onclick="chooseGallery()">🖼 从相册选择 Choose from Gallery</button>
  <button onclick="closePhotoSheet()">取消 Cancel</button>
</div>

<div id="toast" class="toast"></div>
<input type="file" id="photoCam" accept="image/*" capture="environment" style="display:none">
<input type="file" id="photoGallery" accept="image/*" style="display:none">

<script src="app.js"></script>
<script src="pdf.js"></script>
</body>
</html>
