.measure-grid.cols-6{grid-template-columns:repeat(6,1fr)}
.measure-grid.cols-3{grid-template-columns:repeat(3,1fr)}

// ===== IndexedDB (offline fallback) =====
function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open('InspectionDB',2);
    req.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains('reports'))db.createObjectStore('reports',{keyPath:'id'});};
    req.onsuccess=e=>{APP.db=e.target.result;resolve(APP.db);};
    req.onerror=e=>reject(e);
  });
}
async function localSave(report){
  if(!APP.db)return;
  return new Promise(r=>{const tx=APP.db.transaction('reports','readwrite');tx.objectStore('reports').put(report);tx.oncomplete=()=>r();});
}
async function localGetAll(){
  if(!APP.db)return[];
  return new Promise(r=>{const tx=APP.db.transaction('reports','readonly');const req=tx.objectStore('reports').getAll();req.onsuccess=()=>r(req.result||[]);req.onerror=()=>r([]);});
}

// ===== Supabase API Layer =====
const SB_HEADERS = {
  'apikey': SUPABASE_KEY,
  'Authorization': 'Bearer ' + SUPABASE_KEY,
  'Content-Type': 'application/json',
};

async function sbFetch(path, opts = {}) {
  const url = SUPABASE_URL + '/rest/v1/' + path;
  const resp = await fetch(url, {
    ...opts,
    headers: { ...SB_HEADERS, ...(opts.headers || {}) },
  });
  if (!resp.ok) {
    const err = await resp.text();
    throw new Error(err || 'Supabase request failed: ' + resp.status);
  }
  const text = await resp.text();
  return text ? JSON.parse(text) : null;
}

async function checkServer(){
  try{
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), 5000);
    const resp = await fetch(SUPABASE_URL + '/rest/v1/users?select=username&limit=1', {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY },
      signal: ctrl.signal,
    });
    clearTimeout(timer);
    if(resp.ok) serverOnline = true;
    else serverOnline = false;
  } catch(e){ serverOnline=false; console.log('Supabase check:', e.message||'offline'); }
  updateSyncUI();
}

function updateSyncUI(){
  const el=document.getElementById('syncStatus');
  const loginEl=document.getElementById('serverStatus');
  if(el){
    el.innerHTML=serverOnline
      ?'<span class="sync-dot online"></span> 已同步 (云端)'
      :'<span class="sync-dot offline"></span> 离线';
  }
  if(loginEl){
    loginEl.textContent=serverOnline?'✅ 云端已连接 (多设备同步)':'⚠️ 离线模式 (仅本机数据)';
    loginEl.style.color=serverOnline?'#27ae60':'#e67e22';
  }
}

async function syncReports(){
  if(serverOnline){
    try{
      const rows = await sbFetch('reports?select=id,data,status,created_by,created_at,updated_at&order=created_at.desc');
      const full = rows.map(row => {
        const report = row.data || {};
        report.id = row.id;
        report.status = row.status || report.status;
        report.createdBy = row.created_by || report.createdBy;
        return report;
      });
      APP.reports = full;
      for(const r of full){ await localSave(r); }
    } catch(e) {
      console.warn('Sync failed:', e.message);
      APP.reports = await localGetAll();
    }
  } else {
    APP.reports = await localGetAll();
  }
}

async function saveReport(report){
  report.updatedAt = new Date().toISOString();
  await localSave(report);
  if(serverOnline){
    try{
      const row = {
        id: report.id,
        data: report,
        status: report.status || 'draft',
        created_by: report.createdBy || (APP.user && APP.user.username) || '',
        updated_at: report.updatedAt,
      };
      await sbFetch('reports', {
        method: 'POST',
        headers: { 'Prefer': 'resolution=merge-duplicates' },
        body: JSON.stringify(row),
      });
    } catch(e){ console.warn('Cloud save failed, saved locally:', e.message); }
  }
}

// ===== LOGIN =====
async function doLogin(){
  const username=document.getElementById('loginUser').value.trim();
  const password=document.getElementById('loginPass').value;
  const role=document.getElementById('loginRole').value;
  if(!username){showToast('请输入用户名','error');return;}
  if(!password){showToast('请输入密码','error');return;}

  if(serverOnline){
    try{
      const rows = await sbFetch('users?username=eq.' + encodeURIComponent(username) + '&select=*');
      if(!rows || rows.length === 0){ showToast('用户不存在','error'); return; }
      const user = rows[0];
      if(user.password !== password){ showToast('密码错误','error'); return; }
      if(user.role !== role){ showToast('角色不匹配，该用户角色为: ' + (user.role==='supervisor'?'主管':'质检员'),'error'); return; }
      APP.user = { username: user.username, role: user.role, name: user.name };
    }catch(e){
      showToast('登录失败: ' + e.message,'error'); return;
    }
  } else {
    const user=USERS[username];
    if(user){
      if(user.password!==password){showToast('密码错误','error');return;}
      if(user.role!==role){showToast('角色不匹配','error');return;}
    }
    APP.user={username,role,name:user?user.name:username};
  }

  await syncReports();
  document.getElementById('loginPage').classList.remove('active');
  document.getElementById('mainApp').classList.add('active');
  document.getElementById('userBadge').textContent=APP.user.name;
  switchTab('list');
}

function logout(){
  APP.user=null;APP.currentReport=null;
  document.getElementById('mainApp').classList.remove('active');
  document.getElementById('loginPage').classList.add('active');
}

async function editReport(id){
  // Try fetch full report from Supabase
  if(serverOnline){
    try{
      const rows = await sbFetch('reports?id=eq.' + encodeURIComponent(id) + '&select=*');
      if(rows && rows.length > 0){
        const row = rows[0];
        APP.currentReport = row.data || {};
        APP.currentReport.id = row.id;
        APP.currentReport.status = row.status || APP.currentReport.status;
        renderReportForm(); return;
      }
    }catch(e){ console.warn('Supabase fetch failed:', e.message); }
  }
  const r=APP.reports.find(r=>r.id===id);
  if(!r)return;
  APP.currentReport=JSON.parse(JSON.stringify(r));
  // Migrate old 10-element arrays to 6
  ['length','width','thickness','gloss'].forEach(k=>{
    if(APP.currentReport.dimensions[k]&&APP.currentReport.dimensions[k].length>6){
      APP.currentReport.dimensions[k]=APP.currentReport.dimensions[k].slice(0,6);
    }
  });
  renderReportForm();
}

function handlePhoto(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    const img=new Image();
    img.onload=function(){
      const canvas=document.createElement('canvas');
      const max=1024;let w=img.width,h=img.height;
      if(w>max||h>max){if(w>h){h=h*max/w;w=max;}else{w=w*max/h;h=max;}}
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      APP.currentReport.photos[APP.editingPhotoSlot]=canvas.toDataURL('image/jpeg',0.7);
      renderReportForm();showStep(3,document.querySelectorAll('.tabs button')[3]);
      showToast('照片已添加 Photo added','success');
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value='';
}
document.getElementById('photoCam').addEventListener('change',handlePhoto);
document.getElementById('photoGallery').addEventListener('change',handlePhoto);

    <div class="card"><div class="card-header">📊 统计</div><div class="card-body">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center">
        <div style="padding:10px;background:#e8f0fe;border-radius:10px"><div style="font-size:1.5rem;font-weight:700;color:#1a5276">${myR.length}</div><div style="font-size:.75rem;color:#666">总数 Total</div></div>
        <div style="padding:10px;background:#cce5ff;border-radius:10px"><div style="font-size:1.5rem;font-weight:700;color:#004085">${myR.filter(x=>x.status==='submitted').length}</div><div style="font-size:.75rem;color:#666">待审核</div></div>
        <div style="padding:10px;background:#d4edda;border-radius:10px"><div style="font-size:1.5rem;font-weight:700;color:#155724">${myR.filter(x=>x.status==='approved').length}</div><div style="font-size:.75rem;color:#666">已通过</div></div>
        <div style="padding:10px;background:#f8d7da;border-radius:10px"><div style="font-size:1.5rem;font-weight:700;color:#721c24">${myR.filter(x=>x.status==='rejected').length}</div><div style="font-size:.75rem;color:#666">已驳回</div></div>
      </div>
    </div></div>
    <div class="card"><div class="card-body">
      <p style="font-size:.72rem;color:#999">v2.0 · 森雅国际有限公司 Senia International</p>
      <p style="font-size:.72rem;color:#999;margin-top:4px">服务器: ${serverOnline?'✅ 在线 (多设备同步)':'⚠️ 离线 (仅本机)'}</p>
    </div></div>`;
}

// ===== FIX #5: PDF generation - use Blob URL approach for Android compatibility =====
async function generatePDF(){
  const r=APP.currentReport;
  if(!r){showToast('没有数据','error');return;}
  showToast('正在生成PDF... Generating...','info');

  let c=document.getElementById('pdfArea');if(c)c.remove();
  c=document.createElement('div');c.id='pdfArea';
  c.style.cssText='position:absolute;left:-3000px;top:0;z-index:-1;';
  document.body.appendChild(c);

  const CSS=`<style>
    .pg{width:794px;height:1123px;background:#fff;padding:10px 16px;font-family:'Noto Sans','Noto Sans Thai','Noto Sans Myanmar','PingFang SC','Microsoft YaHei',sans-serif;font-size:6.5px;color:#222;line-height:1.3;box-sizing:border-box;position:relative;overflow:hidden}

    table{width:100%;border-collapse:collapse}
    td,th{border:1px solid #999;padding:2px 3px;vertical-align:middle;word-break:break-all;font-size:6px}

    .hdr{background:#1a5276;color:#fff;text-align:center;padding:3px;font-size:7px;font-weight:700;border:none}
    .hdr2{font-size:6.5px}
    .val{font-size:7.5px;font-weight:700;text-align:center}
    .pass{color:#1a8c3e;font-weight:700;font-size:7px;text-align:center}
    .fail{color:#c0392b;font-weight:700}
    .lbl{font-size:5.5px;color:#333;line-height:1.2}
    .pc{width:33.33%;vertical-align:top;padding:1px}
    .pc .pl{font-size:5px;background:#f0f0f0;padding:1px 2px;line-height:1.15;border-bottom:1px solid #ccc;min-height:14px}
    .pc img{width:100%;height:130px;object-fit:cover;display:block}
    .pc .emp{height:130px;background:#fafafa}
    .res{padding:3px;font-size:5.5px;line-height:1.25;border:1px solid #888}
    .resbg{background:#d4edda}
    .ftd{border:none;font-size:5.5px;padding:3px}
  </style>`;

  // Dimension results
  const dimR=(arr)=>arr.some(v=>v!=='')?'PASS':'';

  // Page 1
  const inspHtml=INSPECT_ITEMS.map(it=>{
    const res=r.inspectItems[it.key]||'/';const rem=r.inspectRemarks?.[it.key]||'';
    return `<tr><td class="lbl" style="width:17%;white-space:pre-line">${it.name} ${it.en}\n${it.my}</td>
      <td class="lbl" style="width:13%">${it.std}</td>
      <td class="lbl" style="width:57%;font-size:5px">${rem}</td>
      <td class="${res==='PASS'?'pass':res==='FAIL'?'fail':''}" style="width:13%;text-align:center">${res}</td></tr>`;
  }).join('');

  const dimHtml=['length','width','thickness','gloss'].map((k,ki)=>{
    const labels=['长度 Length\nအလျား','宽度 Width\nအနံ','厚度 Thickness\nအထူ','光泽度 Gloss\nတောက်ပမှု'];
    const stds=[r.dimensions.lengthStd,r.dimensions.widthStd,r.dimensions.thicknessStd,r.dimensions.glossStd];
    const vals=r.dimensions[k];
    return `<tr><td class="lbl" style="white-space:pre-line">${labels[ki]}</td><td style="text-align:center;font-size:5.5px">${stds[ki]}</td>
      ${vals.map(v=>`<td class="val" style="font-size:7px">${v||''}</td>`).join('')}
      <td class="pass">${dimR(vals)}</td></tr>`;
  }).join('');

  const p1=`<div class="pg">
    <table><tr><td colspan="9" class="hdr">森雅国际有限公司 บริษัท เซเนีย อินเตอร์เนชั่นแนล จำกัด Senia International Co., Ltd.</td></tr>
    <tr><td colspan="9" class="hdr hdr2">成品出厂终检报告 Finished Product Release Inspection Report รายงานตรวจสอบปล่อยผลิตภัณฑ์สำเร็จรูป ကုန်ချော ထုတ်ပေးခြင်းဆိုင်ရာ စစ်ဆေးမှုအစီရင်ခံစာ</td></tr></table>
    <table><tr>
      <td class="lbl" style="width:11%">日期 Date\nวันที่ ရက်စွဲ</td><td class="val" style="width:13%">${r.date}</td>
      <td class="lbl" style="width:7%">PO No.</td><td class="val" style="width:13%">${r.poOrderNo}</td>
      <td class="lbl" style="width:16%">彩膜型号 Color Film\nรุ่นฟิล์มสี ရောင်စုံဖလင်</td><td class="val" style="width:13%">${r.colorFilmModel}</td>
    </tr><tr>
      <td class="lbl">产品类别 Product Type\nประเภทผลิตภัณฑ์\nကုန်ပစ္စည်းအမျိုးအစား</td><td class="val">${r.productType}</td>
      <td class="lbl">尺寸 Size\nขนาด အရွယ်အစား</td><td class="val">${r.size}</td>
      <td class="lbl">耐磨层厚度 Wear Layer\nความหนาชั้นกันสึก\nအကြမ်းခံလွှာအထူ</td><td class="val">${r.wearLayerThickness}</td>
    </tr><tr>
      <td class="lbl">扣型 Lock Type\nรูปแบบตัวล็อค\nချိတ်အမျိုးအစား</td><td class="val">${r.lockType}</td>
      <td class="lbl">压纹 Embossed\nลายปั๊มนูน အဆင်</td><td class="val">${r.embossedTexture}</td>
      <td class="lbl">型号 Model\nรุ่น မော်ဒယ်</td><td class="val">${r.model}</td>
    </tr></table>
    <table><tr><th style="width:42%">外观 Appearance ลักษณะภายนอก အသွင်အပြင်</th><th style="width:14%">测量(片) Tests</th><th style="width:14%">不合格 Defects</th><th style="width:16%">检测值 Value</th><th style="width:14%">判定 Result</th></tr>
    <tr><td class="lbl" style="font-size:4.5px;line-height:1.1">缺损、龟裂、皱纹、孔洞、分层、剥离、杂质、气泡、擦伤、胶印、变色、异常凹痕、污迹、白边等 Flaws, cracks, wrinkles, holes, delamination, peeling, impurities, air bubbles, scratches, glue marks, discoloration, stains, white edges etc. ตำหนิ,รอยแตก,รอยยับ,รู,ฟองอากาศ,รอยขีดข่วน,คราบกาว,ขอบขาว ချို့ယွင်းချက်များ၊ အက်ကြောင်းများ၊ အပေါက်များ၊ ပွန်းပဲ့ရာများ</td>
    <td class="val">${r.appearance.testCount}</td><td class="val">${r.appearance.defectCount}</td>
    <td class="lbl" style="font-size:5px">详见抽检照片 Refer to photos\nดูรายละเอียดในภาพ\nဓာတ်ပုံများတွင်ကြည့်ပါ</td><td class="pass">${r.appearance.result||'PASS'}</td></tr></table>
    <table><tr><th style="width:14%">项目 Item\nรายการ အချက်</th><th style="width:9%">标准 Std\nစံနှုန်း</th>${Array.from({length:6},(_,i)=>`<th>${i+1}</th>`).join('')}<th style="width:8%">判定\nResult</th></tr>${dimHtml}</table>
    <table>${inspHtml}</table>
    <table><tr><td class="lbl" style="font-size:5.5px">（${r.packaging.pcsPerBox}）片pcs แผ่น ချပ် ×（${r.packaging.layersPerBox}）层/箱 layer/box ชั้น/กล่อง လွှာ/ပုံး &nbsp; （${r.packaging.boxesPerPallet}）箱boxes กล่อง ပုံး ×（${r.packaging.layersPerPallet}）层/托 layers/pallet ชั้น/พาเลท လွှာ/ခံပြား</td></tr>
    <tr><td class="lbl" style="font-size:5.5px">单包重 Box Wt น้ำหนักกล่อง တစ်ပုံးအလေးချိန်（${r.boxWeightKg}）kg &nbsp; 单拖重 Pallet Wt น้ำหนักพาเลท ခံပြားအလေးချိန်（${r.palletWeightKg}）KG</td></tr></table>
    <div class="res ${r.finalResult==='pass'?'resbg':''}" style="margin:3px 0;white-space:pre-line">${r.finalResult==='pass'
      ?'■检验合格，可以发货。Final inspection PASSED, goods can be shipped.\nผ่านการตรวจสอบ สามารถจัดส่งได้ စစ်ဆေးမှုအောင်မြင်၊ ကုန်ပစ္စည်းများတင်ပို့နိုင်ပါသည်။'
      :'■检验不合格，不能发货。Inspection FAILED, cannot ship.\nไม่ผ่านการตรวจสอบ ไม่สามารถจัดส่งได้ စစ်ဆေးမှုမအောင်မြင်၊ ပို့ဆောင်ပေးခြင်းမပြုလုပ်နိုင်ပါ။'}</div>
    <table><tr><td class="ftd" style="width:40%">终检 Inspector ผู้ตรวจสอบ နောက်ဆုံးစစ်ဆေးသူ：${r.inspector}</td>
    <td class="ftd" style="width:40%">审核 Reviewer ผู้ทบทวน ပြန်လည်စစ်ဆေးသူ：${r.reviewer}</td>
    <td class="ftd" style="width:20%"></td></tr></table>
    <div style="position:absolute;bottom:4px;right:16px;font-size:4.5px;color:#999">DCN:FM-00-QC-023-001</div>
  </div>`;

  // Photo pages
  function photoPage(start,end){
    let rows='';
    for(let i=start;i<end;i+=3){
      rows+='<tr>';
      for(let j=0;j<3;j++){
        const idx=i+j;if(idx>=PHOTO_SLOTS.length){rows+='<td class="pc"><div class="emp"></div></td>';continue;}
        const lbl=PHOTO_SLOTS[idx];const photo=r.photos[idx];
        rows+=`<td class="pc"><div class="pl">${lbl}</div>${photo?`<img src="${photo}">`:'<div class="emp"></div>'}</td>`;
      }
      rows+='</tr>';
    }
    const isLast=end>=PHOTO_SLOTS.length;
    return `<div class="pg">
      <table style="margin-bottom:3px"><tr><td style="font-size:6px;width:50%">PO订单号 PO Order No. အမှာစာနံပါတ် <b>${r.poOrderNo}</b></td>
      <td style="font-size:6px;width:50%">产品型号 Product Model ကုန်ပစ္စည်းမော်ဒယ် <b>${r.colorFilmModel}</b></td></tr></table>
      <table>${rows}</table>
      ${isLast?`<table style="margin-top:4px"><tr><td class="ftd">终检 Inspector စစ်ဆေးသူ：${r.inspector}</td><td class="ftd">审核 Reviewer ပြန်လည်စစ်ဆေးသူ：${r.reviewer}</td><td class="ftd">日期 Date ရက်စွဲ：${r.date}</td></tr></table>`:''}
      <div style="position:absolute;bottom:4px;right:16px;font-size:4.5px;color:#999">FM-QC-86_02 : Rev.00</div>
    </div>`;
  }

  c.innerHTML=CSS+p1+photoPage(0,15)+photoPage(15,29);
  await new Promise(r=>setTimeout(r,600));

  const pages=c.querySelectorAll('.pg');
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});

  for(let i=0;i<pages.length;i++){
    if(i>0)doc.addPage();
    try{
      const canvas=await html2canvas(pages[i],{scale:2,useCORS:true,allowTaint:true,backgroundColor:'#fff',width:794,windowWidth:794});
      doc.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',0,0,210,297);
    }catch(e){console.error('Render error:',e);}
  }
  c.remove();

  // FIX #5: Use Blob + URL for Android compatibility
  try{
    const pdfBlob=doc.output('blob');
    const url=URL.createObjectURL(pdfBlob);
    const a=document.createElement('a');
    a.href=url;
    a.download=`${r.poOrderNo||'Report'}-${r.colorFilmModel||''}-${r.date}.pdf`;
    a.style.display='none';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},3000);
    showToast('PDF已生成 Generated!','success');
  }catch(e){
    // Fallback: open in new tab
    const dataUri=doc.output('datauristring');
    window.open(dataUri,'_blank');
    showToast('PDF已生成 (新窗口打开)','success');
  }
}

// Service Worker
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
