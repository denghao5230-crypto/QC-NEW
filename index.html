<style>
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:14px;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans Myanmar','Noto Sans Thai','Microsoft YaHei',sans-serif;background:#f0f2f5;color:#333;min-height:100vh}
input,select,textarea,button{font-family:inherit;font-size:inherit}

.page{display:none;min-height:100vh}
.page.active{display:flex;flex-direction:column}
.header{background:linear-gradient(135deg,#1a5276,#2980b9);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.header h1{font-size:1.05rem;font-weight:600}
.header-btn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:.85rem}
.content{flex:1;padding:12px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.bottom-nav{display:flex;background:#fff;border-top:1px solid #e0e0e0;position:sticky;bottom:0;z-index:100}
.bottom-nav button{flex:1;padding:10px 0;border:none;background:none;font-size:.75rem;color:#888;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.bottom-nav button.active{color:#1a5276;font-weight:600}
.bottom-nav button svg{width:22px;height:22px}

/* Login */
.login-page.active{background:linear-gradient(135deg,#1a5276 0%,#2980b9 50%,#3498db 100%);align-items:center;justify-content:center;padding:20px}
.login-logo{width:min(280px, 70vw);margin-bottom:20px;display:flex;align-items:center;justify-content:center}
.login-logo svg{width:100%;height:auto}
.login-title{display:none}
.login-subtitle{color:rgba(255,255,255,.8);font-size:.85rem;margin-bottom:24px;letter-spacing:1px}
.login-card{background:#fff;border-radius:16px;padding:24px 20px;width:100%;max-width:360px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.login-card h2{text-align:center;margin-bottom:16px;color:#1a5276;font-size:1.05rem}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:.82rem;color:#666;margin-bottom:4px;font-weight:500}
.form-group input,.form-group select{width:100%;padding:10px 14px;border:1.5px solid #ddd;border-radius:10px;font-size:.95rem}
.form-group input:focus,.form-group select:focus{outline:none;border-color:#2980b9}
.btn{width:100%;padding:12px;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,#1a5276,#2980b9);color:#fff}
.btn-success{background:#27ae60;color:#fff}
.btn-danger{background:#e74c3c;color:#fff}
.btn-outline{background:#fff;color:#1a5276;border:1.5px solid #1a5276}
.btn-sm{padding:8px 16px;font-size:.85rem;width:auto;border-radius:8px}

/* Cards */
.card{background:#fff;border-radius:12px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.08);overflow:hidden}
.card-header{padding:10px 14px;background:#f8f9fa;border-bottom:1px solid #eee;font-weight:600;font-size:.92rem;color:#1a5276}
.card-body{padding:12px 14px}

/* Form */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.field{margin-bottom:10px}
.field label{display:block;font-size:.78rem;color:#888;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:8px;font-size:.9rem;background:#fafafa;color:#333}
.field input:focus,.field select:focus{outline:none;border-color:#2980b9;background:#fff}

/* ===== FIX #4: Measurement inputs clearly visible ===== */
.measure-grid{display:grid;gap:6px}
.measure-grid.cols-6{grid-template-columns:repeat(6,1fr)}
.measure-grid.cols-3{grid-template-columns:repeat(3,1fr)}
.measure-input{border:1.5px solid #d0d0d0;border-radius:8px;padding:10px 4px;text-align:center;font-size:1rem;font-weight:600;color:#1a5276;background:#fff;width:100%;-webkit-appearance:none}
.measure-input:focus{border-color:#2980b9;background:#e8f4fd;outline:none}
.measure-input::placeholder{color:#bbb;font-weight:400;font-size:.8rem}
.dim-label{font-size:.78rem;font-weight:600;color:#1a5276;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.dim-label .std{font-size:.7rem;color:#888;font-weight:400}
.dim-section{margin-bottom:14px}

/* Inspection items */
.inspect-item{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid #f0f0f0;gap:8px}
.inspect-item:last-child{border-bottom:none}
.inspect-item .item-name{flex:1;font-size:.82rem;font-weight:500}
.inspect-item .item-name small{display:block;color:#999;font-size:.68rem;font-weight:400}
.inspect-result{display:flex;gap:4px}
.inspect-result button{padding:5px 10px;border:1.5px solid #ddd;border-radius:6px;font-size:.78rem;cursor:pointer;background:#fff;font-weight:500}
.inspect-result button.pass-active{background:#27ae60;color:#fff;border-color:#27ae60}
.inspect-result button.fail-active{background:#e74c3c;color:#fff;border-color:#e74c3c}
.inspect-result button.na-active{background:#95a5a6;color:#fff;border-color:#95a5a6}

/* Photo grid - FIX #3: shows camera+gallery option */
.photo-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.photo-slot{border:2px dashed #ccc;border-radius:10px;aspect-ratio:4/3;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;position:relative;background:#fafafa}
.photo-slot .label{font-size:.6rem;color:#999;text-align:center;padding:2px 4px;line-height:1.15}
.photo-slot .icon{font-size:1.5rem;color:#bbb;margin-bottom:2px}
.photo-slot img{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0}
.photo-slot .delete-photo{position:absolute;top:2px;right:2px;width:22px;height:22px;background:rgba(231,76,60,.85);color:#fff;border:none;border-radius:50%;font-size:.8rem;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}

/* Photo action sheet */
.action-sheet{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:16px 16px 0 0;padding:16px;z-index:300;box-shadow:0 -4px 20px rgba(0,0,0,.2);transform:translateY(100%);transition:transform .3s}
.action-sheet.show{transform:translateY(0)}
.action-sheet-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:299;display:none}
.action-sheet-overlay.show{display:block}
.action-sheet button{width:100%;padding:14px;border:none;background:none;font-size:1rem;cursor:pointer;border-bottom:1px solid #eee;text-align:center}
.action-sheet button:last-child{border-bottom:none;color:#e74c3c;margin-top:8px}
.action-sheet button:active{background:#f0f0f0}

.tabs{display:flex;gap:4px;overflow-x:auto;padding:8px 0;border-bottom:1px solid #eee;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.tabs button{padding:6px 14px;border:none;background:none;font-size:.85rem;color:#666;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.tabs button.active{color:#1a5276;border-bottom-color:#1a5276;font-weight:600}

.form-step{display:none;margin-bottom:12px}
.form-step.active{display:block}

.pkg-row{display:flex;align-items:center;gap:4px;margin-bottom:8px;font-size:.85rem}
.pkg-row span{font-weight:500}
.pkg-row input{width:60px;padding:6px;border:1px solid #ddd;border-radius:6px;text-align:center}

/* Report list */
.report-item{display:flex;align-items:center;gap:12px;padding:12px;background:#fff;border-radius:10px;margin-bottom:8px;cursor:pointer;transition:background .15s}
.report-item:active{background:#f5f5f5}
.report-info{flex:1}
.report-info h3{font-size:.95rem;font-weight:600;margin-bottom:2px}
.report-info p{font-size:.78rem;color:#888}

/* Badges */
.badge{padding:4px 10px;border-radius:6px;font-size:.75rem;font-weight:600}
.badge-draft{background:#fff3cd;color:#856404}
.badge-submitted{background:#cce5ff;color:#004085}
.badge-approved{background:#d4edda;color:#155724}
.badge-rejected{background:#f8d7da;color:#721c24}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:12px 20px;border-radius:8px;font-size:.9rem;z-index:1000;display:none}
.toast.show{display:block;animation:slideUp .3s}
.toast-info{background:#2980b9}
.toast-success{background:#27ae60}
.toast-warning{background:#e67e22}
.toast-error{background:#e74c3c}

@keyframes slideUp{from{transform:translateX(-50%) translateY(100px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}

/* Empty state */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center;color:#999}
.empty-state .icon{font-size:3rem;margin-bottom:12px}
.empty-state p{font-size:.95rem}

/* Sync UI */
.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.sync-dot.online{background:#27ae60}
.sync-dot.offline{background:#e67e22}

/* Photo handling */
.photo-action-row{display:flex;gap:6px;margin-top:8px}
.photo-action-row button{flex:1;padding:6px;font-size:.75rem}

/* Buttons in form */
.form-button-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.form-button-row.full{grid-template-columns:1fr}

.form-button-row button{padding:12px;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:.9rem}
</style>
</head>

<script>
// ===== CONFIG =====
// API 基路径（Netlify Functions，自动适配开发/生产环境）
const API_BASE = '/api';

// ===== API LAYER =====
async function apiFetch(endpoint, opts = {}) {
  const url = API_BASE + endpoint;
  const resp = await fetch(url, {
    ...opts,
    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
  });
  const text = await resp.text();
  const data = text ? JSON.parse(text) : null;
  if (!resp.ok) {
    throw new Error((data && data.error) || 'API 请求失败: ' + resp.status);
  }
  return data;
}

let serverOnline = false;

// ===== APP STATE =====
const APP = { user: null, reports: [], currentReport: null, currentTab: 'list', editingPhotoSlot: null, db: null };

// ===== XSS PROTECTION: escapeHtml utility =====
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  const s = String(str);
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ===== OFFLINE AUTH (cached sessions) =====
const OFFLINE_USERS = {};

function cacheUserSession(username, role, name) {
  OFFLINE_USERS[username] = { role, name, cachedAt: Date.now() };
  try { localStorage.setItem('senia_cached_users', JSON.stringify(OFFLINE_USERS)); } catch(e) {}
}

function loadCachedUsers() {
  try {
    const cached = localStorage.getItem('senia_cached_users');
    if (cached) Object.assign(OFFLINE_USERS, JSON.parse(cached));
  } catch(e) {}
}
loadCachedUsers();

// FIX #6: Gloss standard options

// ===== IndexedDB (offline fallback) =====
function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open('InspectionDB',2);
    req.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains('reports'))db.createObjectStore('reports',{keyPath:'id'});};
    req.onsuccess=e=>{APP.db=e.target.result;resolve(APP.db);};
    req.onerror=e=>reject(e);
  });
}
async function localSave(report){
  if(!APP.db)return;
  return new Promise(r=>{const tx=APP.db.transaction('reports','readwrite');tx.objectStore('reports').put(report);tx.oncomplete=()=>r();});
}
async function localGetAll(){
  if(!APP.db)return[];
  return new Promise(r=>{const tx=APP.db.transaction('reports','readonly');const req=tx.objectStore('reports').getAll();req.onsuccess=()=>r(req.result||[]);req.onerror=()=>r([]);});
}

// ===== Debounce utility =====
function debounce(fn, delay = 500) {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), delay);
  };
}
const debouncedAutoSave = debounce(() => {
  if (APP.currentReport) localSave(APP.currentReport);
}, 1000);

// ===== Server helpers =====
async function checkServer(){
  try{
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), 5000);
    const resp = await fetch(API_BASE + '/health', { signal: ctrl.signal });
    clearTimeout(timer);
    serverOnline = resp.ok;
  } catch(e){ serverOnline=false; console.warn('Server check:', e.message||'offline'); }
  updateSyncUI();
}

function updateSyncUI(){
  const el=document.getElementById('syncStatus');
  const loginEl=document.getElementById('serverStatus');
  if(el){
    el.innerHTML=serverOnline
      ?'<span class="sync-dot online"></span> 已同步 (云端)'
      :'<span class="sync-dot offline"></span> 离线';
  }
  if(loginEl){
    loginEl.textContent=serverOnline?'✅ 云端已连接 (多设备同步)':'⚠️ 离线模式 (仅本机数据)';
    loginEl.style.color=serverOnline?'#27ae60':'#e67e22';
  }
}

async function syncReports(){
  if(serverOnline){
    try{
      const reports = await apiFetch('/reports');
      APP.reports = reports || [];
      for(const r of APP.reports){ await localSave(r); }
    } catch(e) {
      console.warn('Sync failed:', e.message);
      showToast('同步失败，使用本地数据', 'warning');
      APP.reports = await localGetAll();
    }
  } else {
    APP.reports = await localGetAll();
  }
}

async function saveReport(report){
  report.updatedAt = new Date().toISOString();
  await localSave(report);
  if(serverOnline){
    try{
      await apiFetch('/reports', { method: 'POST', body: JSON.stringify(report) });
      report.syncStatus = 'synced';
      await localSave(report);
    } catch(e){
      console.warn('Cloud save failed:', e.message);
      report.syncStatus = 'pending';
      await localSave(report);
      showToast('云端保存失败，已保存到本地', 'warning');
    }
  } else {
    report.syncStatus = 'pending';
    await localSave(report);
  }
}

async function syncPendingReports() {
  const local = await localGetAll();
  const pending = local.filter(r => r.syncStatus === 'pending');
  for (const r of pending) {
    try {
      await apiFetch('/reports', { method: 'POST', body: JSON.stringify(r) });
      r.syncStatus = 'synced';
      await localSave(r);
    } catch (e) { console.warn('Sync failed for', r.id, e.message); }
  }
  if (pending.length) showToast(`已同步 ${pending.length} 份报告`, 'success');
}

// ===== INIT =====
async function init(){
  try{ await openDB(); }catch(e){ console.warn('IndexedDB failed:',e); }
  await checkServer();
  APP.reports=await localGetAll();
}
init();

window.addEventListener('online', async () => {

// ===== LOGIN =====
async function doLogin(){
  const username=document.getElementById('loginUser').value.trim();
  const password=document.getElementById('loginPass').value;
  const role=document.getElementById('loginRole').value;
  if(!username){showToast('请输入用户名','error');return;}
  if(!password){showToast('请输入密码','error');return;}

  if(serverOnline){
    try{
      // 密码发送到服务端，由 Netlify Function 用 bcrypt 验证
      const user = await apiFetch('/login', {
        method: 'POST',
        body: JSON.stringify({ username, password }),
      });
      if(!user || !user.username){ showToast('用户名或密码错误','error'); return; }
      if(user.role !== role){ showToast('角色不匹配，该用户角色为: ' + (user.role==='supervisor'?'主管':'质检员'),'error'); return; }
      APP.user = { username: user.username, role: user.role, name: user.name };
      // 缓存用户信息供离线使用（不缓存密码）
      cacheUserSession(user.username, user.role, user.name);
    }catch(e){
      showToast('登录失败: ' + e.message,'error'); return;
    }
  } else {
    // 离线模式：使用缓存的用户信息（仅限之前登录过的用户）
    const cached = OFFLINE_USERS[username];
    if(cached){
      if(cached.role!==role){showToast('角色不匹配','error');return;}
      APP.user={username, role:cached.role, name:cached.name};
    } else {
      showToast('离线模式下无法登录新用户，请联网后再试','error');return;
    }
  }

  await syncReports();
  document.getElementById('loginPage').classList.remove('active');
  document.getElementById('mainApp').classList.add('active');
  document.getElementById('userBadge').textContent=APP.user.name;
  switchTab('list');
  window.scrollTo(0,0);
}

function logout(){
  APP.user=null;APP.currentReport=null;
  document.getElementById('mainApp').classList.remove('active');
  document.getElementById('loginPage').classList.add('active');
  window.scrollTo(0,0);
}

// ===== TABS =====
function switchTab(tab){
  APP.currentTab=tab;
  document.querySelectorAll('#bottomNav button').forEach(b=>b.classList.remove('active'));
  const tabEl=document.getElementById('tab'+tab.charAt(0).toUpperCase()+tab.slice(1));
  if(tabEl)tabEl.classList.add('active');
  if(tab==='list')renderReportList();
  else if(tab==='new')startNewReport();
  else if(tab==='me')renderProfile();
  else if(tab==='trash')renderTrash();
}

function showToast(msg,type='info'){
  const t=document.getElementById('toast');t.textContent=msg;
  t.className='toast toast-'+type+' show';
  setTimeout(()=>t.classList.remove('show'),2500);
}

async function editReport(id){
  // 先从已同步的列表中查找（syncReports 已经从服务端拉取）
  const r=APP.reports.find(r=>r.id===id);
  if(!r)return;
  APP.currentReport=JSON.parse(JSON.stringify(r));
  // Migrate old 10-element arrays to 6
  ['length','width','thickness','gloss'].forEach(k=>{
    if(APP.currentReport.dimensions[k]&&APP.currentReport.dimensions[k].length>6){
      APP.currentReport.dimensions[k]=APP.currentReport.dimensions[k].slice(0,6);
    }
  });
  renderReportForm();
}

function UF(key, val){debouncedAutoSave(); APP.currentReport[key]=val;}
function UN(obj,key,val){debouncedAutoSave(); if(!APP.currentReport[obj])APP.currentReport[obj]={};APP.currentReport[obj][key]=(key.includes('testCount')||key.includes('defectCount')||key.includes('pcsPerBox')||key.includes('layersPerBox')||key.includes('boxesPerPallet')||key.includes('layersPerPallet'))?parseInt(val)||0:val;}
function UP(key,val){UN('packaging',key,val);}
function UD(key,idx,val){debouncedAutoSave(); if(!APP.currentReport.dimensions)APP.currentReport.dimensions={}; if(!APP.currentReport.dimensions[key])APP.currentReport.dimensions[key]=[]; APP.currentReport.dimensions[key][idx]=val;}
function UDS(key,val){debouncedAutoSave(); if(!APP.currentReport.dimensions)APP.currentReport.dimensions={}; APP.currentReport.dimensions[key]=val;}
function setInspect(key,val){debouncedAutoSave(); if(!APP.currentReport.inspectItems)APP.currentReport.inspectItems={}; APP.currentReport.inspectItems[key]=val;}
function setFinalResult(val){debouncedAutoSave(); APP.currentReport.finalResult=val;}
function showStep(n,btn){if(btn)btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');document.querySelectorAll('.form-step').forEach(el=>el.style.display='none');const el=document.getElementById('step'+n);if(el)el.style.display='block';}

}
function chooseCamera(){closePhotoSheet();document.getElementById('photoCam').click();}

function handlePhoto(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    const img=new Image();
    img.onload=function(){
      const canvas=document.createElement('canvas');
      let w=img.width,h=img.height,max=800;
      if(w>max||h>max){if(w>h){h=h*max/w;w=max;}else{w=w*max/h;h=max;}}
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      APP.currentReport.photos[APP.editingPhotoSlot]=canvas.toDataURL('image/jpeg',0.7);
      renderReportForm();showStep(3,document.querySelectorAll('.tabs button')[3]);
      showToast('照片已添加 Photo added','success');
    };
    img.onerror=function(){showToast('图片加载失败','error');};
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value='';
}
document.getElementById('photoCam').addEventListener('change',handlePhoto);
document.getElementById('photoGallery').addEventListener('change',handlePhoto);

function delPhoto(i){delete APP.currentReport.photos[i];renderReportForm();showStep(3,document.querySelectorAll('.tabs button')[3]);}

// ===== SAVE / SUBMIT / APPROVE =====
async function saveDraft(){
  const r=APP.currentReport;r.status='draft';
  await saveReport(r);APP.reports=await localGetAll();
  showToast('已保存 Saved','success');
}
async function submitReport(){
  const r=APP.currentReport;
  if(!r.poOrderNo?.trim()){showToast('请填写PO订单号','error');return;}
  if(!r.colorFilmModel?.trim()){showToast('请填写彩膜型号','error');return;}
  r.status='submitted';r.inspector=APP.user.name;
  await saveReport(r);APP.reports=await localGetAll();
  showToast('已提交审核 Submitted','success');switchTab('list');
}
async function approveReport(){
  const r=APP.currentReport;r.status='approved';r.reviewer=APP.user.name;
  await saveReport(r);APP.reports=await localGetAll();
  showToast('已通过 Approved','success');switchTab('list');
}
async function rejectReport(){
  const r=APP.currentReport;r.status='rejected';r.reviewer=APP.user.name;
  await saveReport(r);APP.reports=await localGetAll();

// ===== RECYCLE BIN =====
async function trashReport(){
  if(!confirm('确定删除此报告？\nDelete this report?'))return;
  const r=APP.currentReport;r.status='trashed';r.trashedAt=new Date().toISOString();
  await saveReport(r);APP.reports=await localGetAll();
  showToast('已移入回收站 Moved to trash','info');switchTab('list');
}

async function restoreReport(id){
  const r=APP.reports.find(x=>x.id===id);if(!r)return;
  r.status='draft';delete r.trashedAt;
  await saveReport(r);APP.reports=await localGetAll();
  showToast('已恢复 Restored','success');switchTab('trash');
}

async function permanentDelete(id){
  if(!confirm('永久删除此报告？此操作不可恢复！\nPermanently delete? This cannot be undone!'))return;
  if(APP.db){
    await new Promise(res=>{const tx=APP.db.transaction('reports','readwrite');tx.objectStore('reports').delete(id);tx.oncomplete=()=>res();});
  }
  if(serverOnline){
    try{await apiFetch('/reports?id='+encodeURIComponent(id),{method:'DELETE'});}catch(e){console.warn('Cloud delete failed:',e.message);}
  }
  APP.reports=APP.reports.filter(x=>x.id!==id);
  showToast('已永久删除 Permanently deleted','info');switchTab('trash');
}

function renderTrash(){
  document.getElementById('headerTitle').textContent='回收站 Recycle Bin';
  const trashed=APP.reports.filter(r=>r.status==='trashed');
  trashed.sort((a,b)=>new Date(b.trashedAt||b.updatedAt)-new Date(a.trashedAt||a.updatedAt));

  if(!trashed.length){
    document.getElementById('mainContent').innerHTML=`<div class="empty-state"><div class="icon">🗑</div><p>回收站为空 Recycle bin is empty</p></div>`;return;
  }

  document.getElementById('mainContent').innerHTML=`<div id="trashList">${trashed.map(r=>`
    <div class="report-item" style="opacity:0.8">
      <div style="width:40px;height:40px;background:#f0f0f0;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem">🗑</div>

  // Wait for all images to load before rendering
  const imgs=c.querySelectorAll('img');
  await Promise.all(Array.from(imgs).map(img=>img.complete?Promise.resolve():new Promise(res=>{img.onload=res;img.onerror=res;})));
  await new Promise(r=>setTimeout(r,800));

  const pages=c.querySelectorAll('.pg');
  const{jsPDF}=window.jspdf;
  // Page 1 landscape, pages 2-3 portrait
  const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});

  for(let i=0;i<pages.length;i++){
    const isLand=pages[i].classList.contains('pg-land');
    const pgW=isLand?1123:794;
    if(i>0)doc.addPage('a4',isLand?'landscape':'portrait');
    try{
      const renderScale=3;
      const canvas=await html2canvas(pages[i],{scale:renderScale,useCORS:true,allowTaint:true,backgroundColor:'#fff',width:pgW,windowWidth:pgW});
      const quality=0.92;
      const imgW=isLand?297:210;
      const imgH=isLand?210:297;
      doc.addImage(canvas.toDataURL('image/jpeg',quality),'JPEG',0,0,imgW,imgH);
    }catch(e){console.error('Render error:',e);}
  }
  c.remove();

  // FIX #5: Use Blob + URL for Android compatibility
  try{
    const pdfBlob=doc.output('blob');
    const url=URL.createObjectURL(pdfBlob);
    const a=document.createElement('a');
    a.href=url;
    a.download=`${escapeHtml(r.poOrderNo||'Report')}-${escapeHtml(r.colorFilmModel||'')}-${r.date}.pdf`;
    a.style.display='none';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},3000);
    showToast('PDF已生成 Generated!','success');
  }catch(e){
    // Fallback: open in new tab
    const dataUri=doc.output('datauristring');
    window.open(dataUri,'_blank');
    showToast('PDF已生成 (新窗口打开)','success');
  }
}

// Service Worker
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'activated') {
            showToast('新版本已就绪，请刷新页面', 'info');
          }
        });
      });
    }).catch(e => console.warn('SW registration failed:', e));
  });
}
</script>
</body>
